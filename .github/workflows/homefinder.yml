name: HomeFinder Collector

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run collector
        run: python homefinder.py

      - name: Upload CSV and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: homefinder-results
          path: |
            homefinder_listings.csv
            homefinder_listings.zip
